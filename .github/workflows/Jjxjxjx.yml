name: Find Valid Sub Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

env:
  BASE_SUB: "https://edge.cfgrelay.top/sub/"
  OUTPUT_FILE: "result.txt"
  TOTAL: "2000"
  THREADS: "30"
  HTTP_TIMEOUT: "6"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install aiohttp

      - name: Run finder
        run: |
          cat > finder.py <<'PYEOF'
          import os, uuid, asyncio, aiohttp, json, base64, re

          BASE_SUB = os.environ["BASE_SUB"]
          OUTPUT   = os.environ.get("OUTPUT_FILE", "result.txt")
          THREADS  = int(os.environ.get("THREADS", "30"))
          TOTAL    = int(os.environ.get("TOTAL", "2000"))
          TIMEOUT  = float(os.environ.get("HTTP_TIMEOUT", "6"))

          # الگوی دقیق: https://edge.cfgrelay.top/sub/{uuid v4}
          # uuid v4 = 36 کاراکتر (8-4-4-4-12) با خط تیره
          # کل لینک = دقیقاً مثل نمونه‌ی کاربر
          UUID_RE = re.compile(
              r"^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          )

          STATS = {"generated": 0, "checked": 0, "found": 0, "running": True}

          def save_stats():
              with open("stats.json", "w") as f:
                  json.dump(STATS, f)

          def gen_uuid():
              # uuid4 استاندارد = 36 کاراکتر (8-4-4-4-12)
              return str(uuid.uuid4())

          def is_valid_sub(text: str) -> bool:
              if not text or len(text) < 20:
                  return False
              t = text.strip()
              low = t.lower()
              for bad in ("<html", "<!doctype", "not found", "error",
                          "invalid", "expired", "blocked", "forbidden", "unauthorized"):
                  if bad in low:
                      return False
              # باید base64 معتبر باشه و شامل vless/vmess/trojan/ss باشه
              try:
                  padded = t + "=" * (-len(t) % 4)
                  dec = base64.b64decode(padded, validate=False).decode("utf-8", "ignore")
                  for proto in ("vless://", "vmess://", "trojan://", "ss://"):
                      if proto in dec:
                          return True
              except Exception:
                  pass
              for proto in ("vless://", "vmess://", "trojan://", "ss://"):
                  if proto in t:
                      return True
              return False

          async def check_one(session, sem, uuid_str, results, lock):
              async with sem:
                  url = BASE_SUB + uuid_str
                  STATS["checked"] += 1
                  try:
                      async with session.get(
                          url,
                          timeout=aiohttp.ClientTimeout(total=TIMEOUT),
                          headers={"User-Agent": "Mozilla/5.0"},
                      ) as r:
                          if r.status == 200:
                              text = await r.text()
                              if is_valid_sub(text):
                                  async with lock:
                                      results.append(url)
                                      STATS["found"] = len(results)
                                      with open(OUTPUT, "w", encoding="utf-8") as f:
                                          f.write("\n".join(results))
                                  print(f"[FOUND] {url}", flush=True)
                  except Exception:
                      pass
                  if STATS["checked"] % 25 == 0:
                      save_stats()

          async def main():
              # تولید UUIDهایی که با الگوی uuid v4 مطابقت دارن
              uuids = []
              while len(uuids) < TOTAL:
                  u = gen_uuid()
                  if UUID_RE.match(u):
                      uuids.append(u)

              STATS["generated"] = len(uuids)
              save_stats()

              results = []
              lock = asyncio.Lock()
              sem = asyncio.Semaphore(THREADS)

              conn = aiohttp.TCPConnector(limit=THREADS * 2, ssl=False)
              async with aiohttp.ClientSession(connector=conn) as session:
                  await asyncio.gather(*[check_one(session, sem, u, results, lock) for u in uuids])

              with open(OUTPUT, "w", encoding="utf-8") as f:
                  f.write("\n".join(results))

              STATS["running"] = False
              save_stats()
              print(f"\n[DONE] {len(results)} valid sub(s) found out of {TOTAL}")

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python finder.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.OUTPUT_FILE }} 2>/dev/null || true
          git commit -m "update sub links [skip ci]" || echo "no changes"
          git push || true

      - name: Install cloudflared
        run: |
          curl -sL -o cf.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cf.deb

      - name: Start UI server
        run: |
          cat > ui.py <<'PYEOF'
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json, subprocess

          HTML = """
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <title>Sub Finder</title>
          <style>
          body{font-family:system-ui,sans-serif;background:#0e1116;color:#e6edf3;padding:30px;margin:0}
          h1{color:#58a6ff;margin:0 0 20px}
          .card{background:#161b22;padding:20px;border-radius:12px;margin:15px 0;border:1px solid #30363d}
          button{background:#238636;color:#fff;border:0;padding:12px 24px;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600}
          button:hover{background:#2ea043}
          .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:15px}
          .stat{background:#0d1117;padding:16px;border-radius:10px;border:1px solid #30363d;text-align:center}
          .val{font-size:28px;font-weight:bold;color:#3fb950}
          .lbl{color:#8b949e;font-size:13px;margin-top:4px}
          pre{background:#0d1117;padding:14px;border-radius:8px;max-height:300px;overflow:auto;font-size:13px;color:#8b949e}
          .pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;background:#21262d;margin-left:10px}
          .run{background:#1f6feb}
          .done{background:#238636}
          </style></head><body>
          <h1>Sub Link Finder <span id="pill" class="pill">idle</span></h1>
          <div class="card">
            <button onclick="start()">Start</button>
            <span id="msg" style="margin-left:12px;color:#8b949e"></span>
          </div>
          <div class="stats">
            <div class="stat"><div class="val" id="generated">0</div><div class="lbl">UUIDs</div></div>
            <div class="stat"><div class="val" id="checked">0</div><div class="lbl">Checked</div></div>
            <div class="stat"><div class="val" id="found">0</div><div class="lbl">Found</div></div>
          </div>
          <div class="card"><pre id="log">waiting...</pre></div>
          <script>
          async function start(){ document.getElementById('msg').innerText='starting...'; await fetch('/start'); }
          async function tick(){
            try{
              const d = await (await fetch('/stats')).json();
              document.getElementById('generated').innerText = d.generated||0;
              document.getElementById('checked').innerText   = d.checked||0;
              document.getElementById('found').innerText     = d.found||0;
              const p = document.getElementById('pill');
              p.innerText = d.running ? 'running' : 'done';
              p.className = 'pill ' + (d.running ? 'run' : 'done');
              document.getElementById('log').innerText = await (await fetch('/log')).text();
            }catch(e){}
          }
          setInterval(tick,1500); tick();
          </script></body></html>
          """

          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/":
                      self._send(200, "text/html", HTML)
                  elif self.path == "/stats":
                      try: data = open("stats.json").read()
                      except: data = "{}"
                      self._send(200, "application/json", data)
                  elif self.path == "/log":
                      try: log = open("/tmp/finder.log").read()[-6000:]
                      except: log = ""
                      self._send(200, "text/plain; charset=utf-8", log)
                  elif self.path == "/start":
                      subprocess.Popen("python finder.py > /tmp/finder.log 2>&1", shell=True)
                      self._send(200, "text/plain", "ok")
                  else:
                      self._send(404, "text/plain", "not found")
              def _send(self, code, ct, body):
                  self.send_response(code)
                  self.send_header("Content-Type", ct)
                  self.end_headers()
                  self.wfile.write(body.encode())
              def log_message(self,*a): pass

          HTTPServer(("0.0.0.0", 8000), H).serve_forever()
          PYEOF
          nohup python ui.py > /tmp/ui.log 2>&1 &
          sleep 2

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:8000 > /tmp/tun.log 2>&1 &
          sleep 12
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/tun.log | head -1)
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "### UI URL: $URL" >> $GITHUB_STEP_SUMMARY

      - name: Keep tunnel alive
        run: |
          echo "UI is live at: ${{ env.TUNNEL_URL }}"
          sleep 1800
